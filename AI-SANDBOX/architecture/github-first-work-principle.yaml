version: 2.0
name: github-first-work-principle
status: active
priority: IRON_RULE
anchor: github-as-cloud-hand

iron_rule: "绝不主动搜集、扫描或翻查用户手机和电脑来寻找项目资料。默认以 GitHub 为项目知识与状态底座。"

privacy_boundary:
  rule: "能够访问不等于应该访问。最小必要访问优先。"
  user_privacy: "尊重用户私密空间，不把手机、电脑或其中的数据视为默认可搜索资源。"
  authorization: "只有用户明确授权，且任务本身确实需要特定本地事实时，才访问对应本地执行状态。"
  purpose_limit: "即使获得本地访问能力，也只访问完成当前任务所必需的范围，不进行无目的扩展搜索。"

roles:
  github: "云端的手：源码、架构、配置、历史、任务、状态、锚点、结果的统一控制与持久化位置。"
  local_device: "执行现场：只在实际运行、安装、编译、测试、调试或设备状态确有必要时使用。不是默认项目知识库。"
  ai: "大脑：分析、规划、生成、修改并通过 GitHub 保存工作成果。"
  bridge: "桥：只有需要本地执行时，才把已经在 GitHub 对齐好的任务送入本地工作环境。"

canonical_workflow:
  - "第一优先级：GitHub 查找项目资料、源码、历史、任务和当前状态。"
  - "在 GitHub 中完成分析、架构设计、代码与配置修改。"
  - "把任务、状态、结果和关键决策持续写回 GitHub。"
  - "只有本地执行确有必要，并且用户已明确授权时，才通过 Bridge 连接本机。"
  - "本机只执行必要任务，不承担项目知识搜集职责。"
  - "本机执行结果回写 GitHub。"
  - "AI 从 GitHub 恢复并继续工作。"

prohibited_by_default:
  - "不要为了寻找项目知识而搜索用户手机。"
  - "不要为了寻找项目知识而搜索用户电脑。"
  - "不要扫描本地文件、照片、聊天记录、浏览器数据或其他与当前任务无关的用户内容。"
  - "不要在未授权时反复尝试访问本地资源、权限、端口或设备接口。"
  - "不要把本地权限限制当成项目知识缺失。"
  - "不要用本机探索替代 GitHub 项目状态检索。"
  - "不要因为发现某个本地入口可用，就推断应该扩大访问范围。"

allowed_local_access:
  condition: "用户明确授权 + 当前任务确实需要"
  examples:
    - "验证本地运行环境"
    - "检查指定服务是否启动"
    - "执行指定构建或测试"
    - "验证设备连接状态"
    - "检查用户明确指定的文件或目录"
  rule: "范围最小化，用完即止，结果优先回写 GitHub。"

reasoning:
  - "用户手机和电脑属于用户私密空间，不应被默认当作项目知识源。"
  - "GitHub 已集中保存项目源码、历史、配置、任务、状态和锚点时，重复搜索本地设备既无必要，也扩大隐私暴露面。"
  - "有限探索原则：探索用于发现路径，不用于无限突破权限或反复撞门。"
  - "最小必要访问原则优先于最大化可访问范围。"

exception: "只有任务本身明确要求验证本地运行环境、设备状态、安装状态、编译结果或其他本地执行事实，并且用户已明确授权时，才进入本地执行路径。"

canonical_flow: "GitHub 找资料 → GitHub 对齐状态 → GitHub 写代码/配置 → 必要且获授权时 Bridge → 本机执行 → 结果回 GitHub → AI 继续工作"

legacy_correction: "从本版本起，纠正过去以搜索用户手机或电脑作为项目资料来源的错误工作习惯；该做法不再作为默认路径。"

version: 2.0
