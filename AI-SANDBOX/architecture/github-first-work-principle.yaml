version: 1.0
name: github-first-work-principle
status: active
anchor: github-as-cloud-hand

principle: "项目知识与工作状态优先在 GitHub 中完成，不把用户手机或电脑当作项目知识库。"

roles:
  github: "云端的手：源码、架构、配置、历史、任务、状态、锚点、结果的统一控制与持久化位置。"
  local_device: "执行现场：只在实际运行、安装、编译、测试、调试或设备状态确有必要时使用。"
  ai: "大脑：分析、规划、生成、修改并通过 GitHub 保存工作成果。"
  bridge: "桥：只有需要本地执行时，才把已经在 GitHub 对齐好的任务送入本地工作环境。"

workflow:
  - "GitHub-first：先在 GitHub 查找项目资料、源码、历史和当前状态。"
  - "在 GitHub 中完成分析、架构设计、代码与配置修改。"
  - "把任务、状态、结果和关键决策持续写回 GitHub。"
  - "只有本地执行确有必要时，才通过 Bridge 连接本机。"
  - "本机执行结果回写 GitHub。"
  - "AI 从 GitHub 恢复并继续工作。"

avoid:
  - "不要为了寻找项目知识而搜索用户手机。"
  - "不要为了寻找项目知识而搜索用户电脑。"
  - "不要在未授权时反复尝试访问本地资源。"
  - "不要把本地权限限制当成项目知识缺失。"
  - "不要用本机探索替代 GitHub 项目状态检索。"

reasoning: "本机通常承担执行职责且权限边界复杂；GitHub 集中了项目源码、历史、配置、任务和版本信息，更适合作为云端知识与控制层。"

exception: "只有当任务本身明确要求验证本地运行环境、设备状态、安装状态、编译结果或其他本地执行事实时，才进入本地执行路径。"

canonical_flow: "GitHub 找资料 → GitHub 对齐状态 → GitHub 写代码/配置 → 必要时 Bridge → 本机执行 → 结果回 GitHub → AI 继续工作"
